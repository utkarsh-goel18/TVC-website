name: TVC website checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: primus-admin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate npm lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: refresh npm dependency lockfile"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); console.log("Dependency advisories:", JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, issue] of Object.entries(report.vulnerabilities || {})) { const via = (issue.via || []).map(item => typeof item === "string" ? item : [item.title, item.range, item.url].filter(Boolean).join(" | ")); console.log(name, issue.severity, "direct=" + issue.isDirect, "range=" + issue.range, "fixAvailable=" + JSON.stringify(issue.fixAvailable), "via=" + JSON.stringify(via)); }'
      - name: Typecheck
        run: npm run typecheck
      - name: Lint changed PRIMUS files
        run: |
          npx eslint \
            src/app/admin/primus/page.tsx \
            src/app/admin/primus/layout.tsx \
            src/app/api/primus/admin/registrations/route.ts \
            src/app/api/primus/teams/route.ts \
            src/app/api/primus/teams/join/route.ts \
            'src/app/api/primus/teams/[teamCode]/submit/route.ts' \
            src/components/events/primus-registration.tsx \
            src/lib/primus/registration.ts
      - name: Production build
        run: npm run build

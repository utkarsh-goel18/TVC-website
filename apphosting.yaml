# Firebase App Hosting configuration for the TVC Next.js application.
# App Hosting provides Application Default Credentials at runtime.
env:
  - variable: FIREBASE_PROJECT_ID
    value: tvc-primus-2026
  - variable: THAPAR_EMAIL_DOMAIN
    value: thapar.edu
  - variable: NEXT_PUBLIC_SATURNALIA_REGISTRATION_URL
    value: https://www.saturnalia.in/events/business
